<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weizend Realtime Test</title>
  <style>
    body {
      background:#080808;
      color:#fff;
      font-family:Arial,sans-serif;
      padding:30px;
    }
    #status {
      font-size:24px;
      font-weight:bold;
      margin-bottom:20px;
    }
    #log {
      white-space:pre-wrap;
      background:#111;
      border:1px solid #333;
      padding:15px;
      border-radius:10px;
    }
  </style>
</head>
<body>

<div id="status">⏳ WebSocket bağlanıyor...</div>
<div id="log"></div>

<script>
const status = document.getElementById('status');
const log = document.getElementById('log');

const ws = new WebSocket(
  'wss://weizend-market-api.vercel.app/realtime/ws?user=Weizend'
);

ws.onopen = () => {
  status.innerText = '✅ WEBSOCKET BAĞLANDI';
  log.innerText += 'Bağlantı açıldı.\n';
};

ws.onmessage = (event) => {
  log.innerText += 'MESAJ: ' + event.data + '\n';
};

ws.onerror = () => {
  status.innerText = '❌ WEBSOCKET HATASI';
  log.innerText += 'WebSocket bağlantısı hata verdi.\n';
};

ws.onclose = (event) => {
  log.innerText +=
    'Bağlantı kapandı. Kod: ' +
    event.code +
    '\n';
};
</script>

</body>
</html>
